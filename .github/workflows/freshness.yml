name: Freshness check
on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail when a dated fact or play is past its review date
        run: node tools/freshness.mjs
