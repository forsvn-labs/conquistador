name: Product checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The supported floor and the current release.
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run bootstrap
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code -- runtime/lib
      - name: Terminal and writing E2E
        if: matrix.node == '24'
        run: |
          node tools/e2e/installer.mjs
          node tools/e2e/check.mjs
          node tools/e2e/social-style.mjs
      - uses: actions/upload-artifact@v4
        if: always() && matrix.node == '24'
        with:
          name: terminal-and-writing-e2e
          path: dist/e2e
