name: Product checks
on:
  pull_request:
  push:
    branches: [main, dogfood/0.1.0, private-alpha]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run bootstrap
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code -- runtime/lib
