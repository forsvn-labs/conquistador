name: Integration release watch
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
jobs:
  releases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check published versions without installing or upgrading
        run: node tools/integration-releases.mjs check-updates > integration-releases.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-release-report
          path: integration-releases.json
          retention-days: 14
