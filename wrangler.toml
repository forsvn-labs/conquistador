# Cloudflare Worker for the hosted Conquistador MCP server. See INSTALL.md, "Hosted server".
# Secrets: CONQUISTADOR_MCP_TOKEN (admin), CONQUISTADOR_RECEIPT_KEY, GITHUB_CLIENT_ID, and
# GITHUB_CLIENT_SECRET (sign-up). Without them the Worker refuses the matching requests.
name = "conquistador-mcp"
main = "worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
no_bundle = true
find_additional_modules = true
base_dir = "."

# The API hostname. A zone configuration rule turns off the browser integrity check for this host
# only, so plain HTTP clients are not refused (workers.dev stays on as a fallback).
routes = [
  { pattern = "mcp.forsvn.com", custom_domain = true },
]
workers_dev = true

# Personal tokens. KV holds the SHA-256 hash of each token and the GitHub id and login of its owner.
# Create the namespace once (wrangler kv namespace create conquistador-tokens) and add its id here.
# wrangler dev uses a local namespace without an id.
[[kv_namespaces]]
binding = "TOKENS"

# Requests per minute for each token (personal or admin). Change limit and RATE_LIMIT_PER_MINUTE
# together; the period must be 10 or 60. namespace_id is any number unique in the account.
[[ratelimits]]
name = "MCP_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Sign-in attempts per minute from one IP address (/signup/start and POST /api/login).
[[ratelimits]]
name = "SIGNUP_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[vars]
RATE_LIMIT_PER_MINUTE = "60"

# Only the modules the server imports and the bundled library. Never local playbooks.
[[rules]]
type = "ESModule"
globs = ["tools/skills-mcp.mjs", "tools/mcp-http.mjs", "tools/brief.mjs", "tools/context-files.mjs", "tools/context-selection.mjs", "tools/request-text.mjs", "tools/routing-contract.mjs", "tools/domain-package.mjs", "tools/method-library.mjs", "tools/plugin-contracts.mjs", "tools/module-root.mjs", "tools/rubric-gate.mjs", "tools/check-receipt.mjs", "tools/hosted-auth.mjs", "tools/mcp-client-config.mjs", "tools/check/*.mjs"]
fallthrough = false

[[rules]]
type = "Text"
globs = ["package.json", "skills/**/*.md", "skills/**/*.json", "skills/**/*.yaml", "skills/**/*.py", "skills/**/*.sh", "skills/**/*.swift", "skills/**/*.pbxproj", "skills/**/*.xcworkspacedata"]
fallthrough = false

# Turn off Wrangler's default rules (for example **/*.wasm, **/*.js), which would upload files
# from node_modules and other folders.
[[rules]]
type = "CommonJS"
globs = []
fallthrough = false

[[rules]]
type = "CompiledWasm"
globs = []
fallthrough = false

[[rules]]
type = "Data"
globs = []
fallthrough = false
